name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check skill structure and local references
        run: python3 scripts/check_skill.py .
      - name: Run speech preflight regression tests
        run: python3 -m unittest discover -s scripts -p 'test_speech_preflight.py' -v
